const KEY='uiu-clearance-demo-v1';
const DEPTS=[['education','Education','🎓'],['library','Library','📚'],['transport','Transport','🚌'],['medical','Medical','🏥'],['hostel','Hostel','🏠']];
const demoSeed=()=>({role:'student',requests:{education:'Approved',library:'Approved',transport:'Pending',medical:'Not applied',hostel:'Not applied'},documents:[{name:'Student ID Card',type:'ID',date:'18 Nov 2026'},{name:'Library Return Slip',type:'Library',date:'18 Nov 2026'}],emergencies:[],notifs:[{title:'Library clearance approved',desc:'Your library request has been approved.',date:'Demo · 18 Nov'},{title:'Transport request received',desc:'Your request is in the review queue.',date:'Demo · 18 Nov'}],activity:[{title:'Demo initialized',detail:'All information is fictional sample data.'}],certificate:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||demoSeed()}catch(_){s=demoSeed()}
for(const key of ['requests','documents','emergencies','notifs','activity'])if(!s[key])s[key]=demoSeed()[key];if(!s.role)s.role='student';
const $$=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(_){}};
const status=st=>`<span class="status ${esc(st.toLowerCase().replace(/ /g,'-'))}">${esc(st)}</span>`;
const btn=(label,route,variant='blue')=>`<button class="btn btn-${variant}" data-route="${route}">${label}</button>`;
const count=st=>Object.values(s.requests).filter(x=>x===st).length;
const approved=()=>count('Approved');const allApproved=()=>approved()===5;
const header=(title,desc,action='')=>`<div class="page-head"><div><div class="eyebrow">UIU Clearance · Interactive prototype</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;
const card=(contents,cls='')=>`<div class="card ${cls}">${contents}</div>`;
const progress=()=>`<div class="progress"><span style="width:${approved()*20}%"></span></div><div class="progress-meta"><span>${approved()} of 5 departments approved</span><b>${approved()*20}%</b></div>`;
const stat=(label,val,ico,note)=>`<div class="card stat"><div class="stat-top">${label}<span class="stat-icon">${ico}</span></div><strong>${val}</strong><small>${note||'Demo information'}</small></div>`;
function sideLinks(){let role=s.role;return role==='student'?[['Overview',[['dashboard','Dashboard','⌂']]],['Clearance',[['apply','Apply for clearance','↗'],['track','Track status','◷'],['documents','My documents','▣']]],['Support',[['emergency','Emergency request','⚑'],['notifications','Notifications','♢']]]]:role==='admin'?[['Department Admin',[['admin','Dashboard','⌂'],['requests','Clearance requests','☷'],['urgent','Emergency inbox','⚑']]]]:[['Vice Chancellor',[['vc','Overview','⌂'],['certificates','Certificates','▣'],['activity','Activity log','◷']]]];}
function navHtml(active){return sideLinks().map(([title,links])=>`<div class="side-label">${title}</div>`+links.map(([id,name,ico])=>`<button data-route="${id}" class="nav-link ${id===active?'active':''}"><span class="ico">${ico}</span>${name}</button>`).join('')).join('');}
function features(){return `<div class="grid three">${[
['🎓','Student portal','Apply to five clearance departments and follow request progress.','student','dashboard'],
['🗂️','Department review','Explore approval, rejection, on-hold, and administrative workflows.','admin','admin'],
['🏛️','Vice Chancellor','Review university-wide clearance progress and certificates.','vc','vc']].map(([ico,title,desc,role,route])=>`<div class="card feature"><div class="feat-icon">${ico}</div><h3>${title}</h3><p>${desc}</p><div><button class="btn btn-pale btn-sm" data-enter="${role}:${route}">Explore ${title} →</button></div></div>`).join('')}</div>`;}
function home(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">UIU Clearance System · Project showcase</div><h1>A simpler path from application to clearance.</h1><p>One platform for students, department administrators, and the Vice Chancellor to manage university clearance workflows.</p><div class="hero-actions"><button class="btn btn-white" data-enter="student:dashboard">Explore student demo →</button><button class="btn" style="border-color:#ffffff66;background:#ffffff14;color:white" data-enter="admin:admin">View admin workflow</button></div></div><div class="hero-illustration"><div class="hero-panel"><strong>Clearance status</strong><div><span>Education</span><b>✓ Approved</b></div><div><span>Library</span><b>✓ Approved</b></div><div><span>Transport</span><b>◷ Pending</b></div><div><span>Progress</span><b>40%</b></div></div></div></div><div class="callout">DEMO MODE — The information is fictional and saved in this browser only. No real university accounts, files, or database are connected.</div><div class="section-title"><h2>Explore the platform</h2><span class="thin">Three user roles</span></div>${features()}<div class="section-title"><h2>How the process works</h2></div><div class="grid three">${[['1','Student applies','Submit a request to any of the five clearance departments.'],['2','Admin reviews','Departments approve, put on hold, or reject requests with remarks.'],['3','Final clearance','Once departments approve, the VC can issue a demo certificate.']].map(([n,t,d])=>`<div class="card"><div class="eyebrow">Step ${n}</div><h3>${t}</h3><p style="margin-bottom:0;font-size:13px">${d}</p></div>`).join('')}</div>`}
function studentDashboard(){return header('Student dashboard','Welcome back, Ayesha. Follow your clearance journey from one place.',btn('Apply for clearance','apply'))+`<div class="grid four">${stat('Approved',approved(),'✓','Departments completed')}${stat('Pending',count('Pending'),'◷','Awaiting a decision')}${stat('Not applied',count('Not applied'),'↗','Still to submit')}${stat('Overall progress',approved()*20+'%','◉','Across five departments')}</div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title" style="margin-top:0"><h2>Clearance progress</h2><button class="btn btn-pale btn-sm" data-route="track">View timeline</button></div>${progress()}<div class="stack" style="margin-top:22px">${DEPTS.map(([id,name,ico])=>`<div class="item"><div class="dept-row"><div class="dept-icon">${ico}</div><div><div class="item-title">${name}</div><div class="item-sub">Department clearance</div></div></div>${status(s.requests[id])}</div>`).join('')}</div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Recent notifications</h2><button class="btn btn-pale btn-sm" data-route="notifications">View all</button></div>${s.notifs.slice(0,5).map(n=>`<div class="item" style="margin-bottom:11px"><div><div class="item-title">${esc(n.title)}</div><div class="item-sub">${esc(n.desc)}</div><div class="item-sub">${esc(n.date)}</div></div><span class="dept-icon">✉</span></div>`).join('')||'<div class="empty">No notifications yet.</div>'}<div class="notice" style="margin-top:17px">Tip: You can switch roles using the selector at the top to see the admin review process.</div></div></div>`;}
function apply(){return header('Apply for clearance','Choose a department and submit a simulated request.',btn('Track my applications','track','pale'))+`<div class="grid two">${DEPTS.map(([id,name,ico])=>`<div class="card"><div class="action-row"><div class="dept-row"><div class="dept-icon">${ico}</div><div><h3 style="margin:0">${name}</h3><div class="thin">Clearance application</div></div></div>${status(s.requests[id])}</div><p style="font-size:13px;margin:17px 0">${{education:'Verify academic and fee clearance records.',library:'Confirm there are no outstanding borrowed materials.',transport:'Review university transport liabilities.',medical:'Complete medical-related clearance checks.',hostel:'Review hostel accommodation obligations.'}[id]}</p><button class="btn ${s.requests[id]==='Approved'?'btn-muted':'btn-pale'} btn-sm" data-apply="${id}" ${s.requests[id]==='Approved'?'disabled':''}>${s.requests[id]==='Not applied'?'Submit demo request':s.requests[id]==='Approved'?'Already approved':'Resubmit request'}</button></div>`).join('')}</div><div class="notice" style="margin-top:18px">Submitting changes a fictional local record. No actual application is sent to UIU.</div>`;}
function track(){return header('Track clearance','An overview of all five department decisions and final certificate eligibility.')+`<div class="grid two"><div class="card"><h2>Overall progress</h2>${progress()}<div class="timeline" style="margin-top:23px">${DEPTS.map(([id,name,ico],i)=>`<div class="timeline-row"><div class="timeline-rail"><span class="timeline-dot">${s.requests[id]==='Approved'?'✓':i+1}</span>${i<4?'<span class="timeline-line"></span>':''}</div><div class="timeline-desc"><div class="action-row"><strong>${ico} ${name}</strong>${status(s.requests[id])}</div><small>${s.requests[id]==='Approved'?'Department clearance complete':s.requests[id]==='Pending'?'Awaiting administrative review':'Use Apply for clearance to update this step'}</small></div></div>`).join('')}</div></div><div class="stack"><div class="card"><h2>Final clearance</h2>${allApproved()?'<div class="notice">All departments are approved. Explore the Vice Chancellor certificate workflow.</div>':'<p>You become eligible for a clearance certificate when all five departments approve your requests.</p>'}<button class="btn btn-pale" data-enter="vc:certificates">View VC workflow →</button></div><div class="card"><h3>Demo student details</h3><div class="item"><span class="thin">Name</span><b>Ayesha Rahman</b></div><div class="item"><span class="thin">Student ID</span><b>DEMO-2026-001</b></div><div class="item"><span class="thin">Program</span><b>Computer Science</b></div></div></div></div>`;}
function documents(){return header('My documents','Sample documents used during clearance review.',btn('Add demo document','adddoc'))+`<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Document</th><th>Type</th><th>Added</th><th>Availability</th></tr></thead><tbody>${s.documents.map(d=>`<tr><td>📄 ${esc(d.name)}</td><td>${esc(d.type)}</td><td>${esc(d.date)}</td><td><span class="status submitted">Demo only</span></td></tr>`).join('')}</tbody></table></div></div><div class="notice" style="margin-top:16px">For privacy, demo uploads only remember filenames. Files are not read, transferred, or stored on a server.</div>`;}
function adddoc(){return header('Add demo document','Try the upload interface without transferring any real files.',btn('Back to documents','documents','muted'))+`<div class="card" style="max-width:650px"><form id="doc-form"><div class="form-grid"><div class="field"><label>Document type</label><select class="input" name="docType" required><option>Student ID</option><option>Fee Receipt</option><option>Library Card</option><option>Transcript</option><option>Other</option></select></div><div class="field"><label>Select a file (name only)</label><input class="input" name="file" type="file" required></div></div><div class="form-actions"><button class="btn btn-blue" type="submit">Add demo record</button></div></form><p class="help-text" style="margin-top:16px">Your file content remains on your device. Only its name appears in this demo.</p></div>`;}
function emergency(){return header('Emergency clearance request','Show how a student submits an urgent request to administrators.')+`<div class="grid two"><div class="card"><h2>New emergency request</h2><form id="emergency-form"><div class="field"><label>Request reason</label><select name="reason" class="input" required><option value="">Choose a reason</option><option>Urgent job application</option><option>Graduate admission deadline</option><option>Scholarship deadline</option><option>Other urgent reason</option></select></div><div class="field" style="margin-top:13px"><label>Explain the urgency</label><textarea name="details" class="input" maxlength="600" required placeholder="Describe your situation..."></textarea></div><div class="form-actions"><button class="btn btn-blue" type="submit">Submit demo request</button></div></form></div><div class="card"><h2>My requests</h2>${s.emergencies.length?s.emergencies.map(e=>`<div class="item"><div><div class="item-title">${esc(e.reason)}</div><div class="item-sub">${esc(e.details)}</div></div>${status(e.status)}</div>`).join(''):'<div class="empty"><span class="symbol">⚑</span><b>No emergency requests</b>Submit a sample request to see it here and in the admin inbox.</div>'}</div></div>`;}
function notifications(){return header('Notifications','Updates generated by actions you take in the demo.')+`<div class="card stack">${s.notifs.length?s.notifs.map(n=>`<div class="item"><div><div class="item-title">${esc(n.title)}</div><div class="item-sub">${esc(n.desc)}</div><div class="item-sub">${esc(n.date)}</div></div><span class="dept-icon">✉</span></div>`).join(''):'<div class="empty">No notifications yet.</div>'}</div>`;}
function adminHome(){return header('Department admin dashboard','Review student clearance applications and urgent requests.',btn('Open review queue','requests'))+`<div class="grid four">${stat('Total departments',5,'▦','In clearance process')}${stat('Approved',approved(),'✓','Student demo requests')}${stat('Pending',count('Pending'),'◷','Needs attention')}${stat('Urgent requests',s.emergencies.filter(x=>x.status==='Pending').length,'⚑','Pending review')}</div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title" style="margin:0 0 14px"><h2>Clearance queue</h2><button class="btn btn-pale btn-sm" data-route="requests">Manage requests</button></div><div class="stack">${DEPTS.map(([id,name,ico])=>`<div class="item"><div class="dept-row"><span class="dept-icon">${ico}</span><div><div class="item-title">${name}</div><div class="item-sub">Ayesha Rahman · DEMO-2026-001</div></div></div>${status(s.requests[id])}</div>`).join('')}</div></div><div class="card"><h2>Review workflow</h2><p>A department administrator can accept, put on hold, or reject a clearance request. Those decisions are reflected immediately in the student view in this browser.</p><div class="notice">Try approving Transport, Medical, and Hostel requests, then switch to Vice Chancellor to issue a demo certificate.</div><div style="margin-top:22px">${btn('Open clearance requests','requests')}</div></div></div>`;}
function requests(){return header('Clearance requests','One fictional student record demonstrates the five-department approval workflow.')+`<div class="card flush"><div class="table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Department</th><th>Status</th><th>Review actions</th></tr></thead><tbody>${DEPTS.map(([id,name,ico])=>`<tr><td><b>Ayesha Rahman</b><div class="item-sub">DEMO-2026-001</div></td><td>${ico} ${name}</td><td>${status(s.requests[id])}</td><td><div class="action-row" style="justify-content:flex-start;gap:5px"><button class="btn btn-green btn-sm" data-status="${id}:Approved">Approve</button><button class="btn btn-muted btn-sm" data-status="${id}:On hold">Hold</button><button class="btn btn-red btn-sm" data-status="${id}:Rejected">Reject</button></div></td></tr>`).join('')}</tbody></table></div></div><div class="notice" style="margin-top:17px">All reviews are simulations. They update your local browser state; no administrator permissions are granted.</div>`;}
function urgent(){return header('Emergency inbox','Urgent clearance requests submitted in the demo.')+`<div class="card">${s.emergencies.length?s.emergencies.map((e,i)=>`<div class="item"><div style="flex:1"><div class="item-title">${esc(e.reason)}</div><div class="item-sub">${esc(e.details)}</div><div class="item-sub">Ayesha Rahman · DEMO-2026-001</div></div>${status(e.status)} ${e.status==='Pending'?`<button class="btn btn-green btn-sm" data-emergency="${i}">Resolve</button>`:''}</div>`).join(''):'<div class="empty"><span class="symbol">⚑</span><b>Inbox is clear</b>Switch to the student role to submit a sample urgent request.</div>'}</div>`;}
function vc(){return header('Vice Chancellor dashboard','University-wide oversight in this fictional single-student walkthrough.',btn('View certificates','certificates'))+`<div class="grid four">${stat('Demo students',1,'♙','Synthetic student profile')}${stat('Approved steps',approved()+'/5','✓','Across five departments')}${stat('Eligible students',allApproved()?1:0,'◈','All clearances complete')}${stat('Issued certificates',s.certificate?1:0,'▣','Simulated documents')}</div><div class="grid two" style="margin-top:18px"><div class="card"><h2>Department approvals</h2><div class="chart-bars">${DEPTS.map(([id,name])=>`<div class="bar-col"><b style="font-size:12px">${s.requests[id]==='Approved'?'100%':'0%'}</b><div class="bar" style="height:${s.requests[id]==='Approved'?'125':'12'}px;opacity:${s.requests[id]==='Approved'?1:.3}"></div><span>${name}</span></div>`).join('')}</div><p class="help-text" style="margin-top:15px">Approval state for the fictional student</p></div><div class="card"><h2>Certificate eligibility</h2>${progress()}<p style="margin-top:18px">${allApproved()?'The sample student has completed all five departments and is eligible for certificate issuance.':'The sample student needs approval from all five departments before final clearance.'}</p>${btn('Open certificate queue','certificates','pale')}</div></div>`;}
function certificates(){return header('Clearance certificates','Issue a simulated completion certificate when all five departments are approved.')+`<div class="card"><div class="action-row"><div><h2 style="margin-bottom:5px">Ayesha Rahman</h2><p style="margin-bottom:0">DEMO-2026-001 · Computer Science</p></div>${s.certificate?status('Issued'):allApproved()?status('Approved'):status('Pending')}</div><div style="margin-top:22px">${progress()}</div><div class="action-row" style="margin-top:22px"><div class="thin">${s.certificate?'Demo certificate issued in this browser.':allApproved()?'All clearances complete. Ready to issue.':'Complete department reviews to enable issuance.'}</div><button class="btn btn-blue" data-issue ${!allApproved()||s.certificate?'disabled':''}>${s.certificate?'Certificate issued':'Issue demo certificate'}</button></div></div><div class="notice" style="margin-top:16px">This is not an official university certificate. The demo never produces or verifies a real credential.</div>`;}
function activity(){return header('Activity log','Actions taken during this browser demonstration.')+`<div class="card stack">${s.activity.slice().reverse().map(a=>`<div class="item"><div><div class="item-title">${esc(a.title)}</div><div class="item-sub">${esc(a.detail)}</div></div><span class="dept-icon">◷</span></div>`).join('')}</div>`;}
const views={home, dashboard:studentDashboard,apply,track,documents,adddoc,emergency,notifications,admin:adminHome,requests,urgent,vc,certificates,activity};
function render(){let current=location.hash.replace(/^#\/?/,'')||'home';if(!views[current])current='home';const preferred=current==='home'?null:['dashboard','apply','track','documents','adddoc','emergency','notifications'].includes(current)?'student':['admin','requests','urgent'].includes(current)?'admin':'vc';if(preferred&&preferred!==s.role){s.role=preferred;save()}$$('app').innerHTML=`<div class="topline"></div><header class="app-header"><a class="brand" href="#home" aria-label="UIU Clearance Home"><img class="brand-logo" src="${window.UIU_DEMO_LOGO}" alt="UIU Logo"><span class="brand-name">Clearance System<small>University Management</small></span></a><div class="header-actions"><span class="demo-pill">● Interactive demo</span><select class="rolepicker" aria-label="Switch demo role" id="role-change"><option value="student" ${s.role==='student'?'selected':''}>🎓 Student view</option><option value="admin" ${s.role==='admin'?'selected':''}>🗂️ Admin view</option><option value="vc" ${s.role==='vc'?'selected':''}>🏛️ VC view</option></select><button class="btn btn-muted btn-sm" id="reset-demo" title="Reset fictional demo data">↻ Reset</button></div></header><div class="mobile-nav"><button data-route="home" class="${current==='home'?'active':''}">Home</button>${sideLinks().flatMap(x=>x[1]).map(([id,name])=>`<button data-route="${id}" class="${id===current?'active':''}">${name}</button>`).join('')}</div><div class="app-layout"><aside class="sidebar"><div class="side-label">Explore</div><button class="nav-link ${current==='home'?'active':''}" data-route="home"><span class="ico">⌂</span>Project home</button>${navHtml(current)}<div class="sidebar-bottom">DEMO PROJECT<br>Data stored only in your browser.<br>No PHP or MySQL connection.</div></aside><main class="main">${views[current]()}<footer class="footer"><span>UIU Clearance System · Interactive frontend prototype</span><strong>Fictional data · Not an official UIU service</strong></footer></main></div>`;document.title=(current==='home'?'Project showcase':current.charAt(0).toUpperCase()+current.slice(1))+' | UIU Clearance Demo';}
function toast(msg){document.querySelectorAll('.toast').forEach(el=>el.remove());let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function note(title,detail){s.activity.push({title,detail});s.notifs.unshift({title,desc:detail,date:'Just now · Demo'})}
function go(target){location.hash=target;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route);return}const enter=e.target.closest('[data-enter]');if(enter){let [role,page]=enter.dataset.enter.split(':');s.role=role;save();go(page);return}const apply=e.target.closest('[data-apply]');if(apply){let id=apply.dataset.apply; if(s.requests[id]==='Approved')return;s.requests[id]='Pending';note('Clearance request submitted',`${DEPTS.find(x=>x[0]===id)[1]} department application submitted for review.`);save();render();toast('Demo request submitted. Switch to Admin view to review it.');return}const st=e.target.closest('[data-status]');if(st){let [id,choice]=st.dataset.status.split(':');if(s.requests[id]==='Not applied'&&choice!=='Approved'){toast('No request was submitted yet. Submit from Student view first.');return}s.requests[id]=choice;if(choice!=='Approved')s.certificate=false;note(`${DEPTS.find(x=>x[0]===id)[1]}: ${choice}`,`Department request decision updated to ${choice.toLowerCase()}.`);save();render();toast('Sample request updated.');return}const em=e.target.closest('[data-emergency]');if(em){let n=Number(em.dataset.emergency);if(s.emergencies[n]){s.emergencies[n].status='Resolved';note('Emergency request resolved',s.emergencies[n].reason);save();render();toast('Emergency request marked resolved.')}return}if(e.target.closest('[data-issue]')){if(!allApproved()||s.certificate)return;s.certificate=true;note('Demo certificate issued','All five departments approved the fictional student.');save();render();toast('Simulated certificate issued.');return}if(e.target.closest('#reset-demo')){if(confirm('Reset all fictional demo data in this browser?')){s=demoSeed();save();go('home');toast('Demo data reset.')}return}});
document.addEventListener('change',e=>{if(e.target.id==='role-change'){s.role=e.target.value;save();go(s.role==='student'?'dashboard':s.role==='admin'?'admin':'vc')}});
document.addEventListener('submit',e=>{if(e.target.id==='doc-form'){e.preventDefault();const f=new FormData(e.target),name=f.get('file')?.name;if(!name){toast('Please select a file first.');return}s.documents.unshift({name:String(name).slice(0,90),type:String(f.get('docType')),date:'Just now · Demo'});note('Demo document added',`Sample file name: ${String(name).slice(0,90)}`);save();go('documents');toast('File name added. No file was uploaded.')}else if(e.target.id==='emergency-form'){e.preventDefault();let f=new FormData(e.target);s.emergencies.unshift({reason:String(f.get('reason')),details:String(f.get('details')).slice(0,600),status:'Pending'});note('Emergency request submitted',String(f.get('reason')));save();render();toast('Demo emergency request submitted.')}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
})();
</script></body></html>
